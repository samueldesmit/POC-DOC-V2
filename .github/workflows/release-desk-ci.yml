name: Validate Release Desk
on:
  push:
    branches: [main, staging]
    paths: ['apps/release-desk/**', '.github/workflows/release-desk-ci.yml', '.github/workflows/review-pr.yml', '.github/scripts/**']
  pull_request:
    branches: [main, staging]
    paths: ['apps/release-desk/**', '.github/workflows/release-desk-ci.yml', '.github/workflows/review-pr.yml', '.github/scripts/**']
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/release-desk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test ../../.github/scripts/*.test.mjs
      - run: npm test
      - run: npm run build
